manifest-version = "1"
requires-python = ">=3.12"

[[package]]
name = "flask"
version = "3.0.3"
source = { registry = "https://pypi.org" }
dependencies = [
    { name = "blinker" },
    { name = "click" },
    { name = "itsdangerous" },
    { name = "jinja2" },
    { name = "werkzeug" },
]

[[package]]
name = "blinker"
version = "1.8.2"
source = { registry = "https://pypi.org" }

[[package]]
name = "click"
version = "8.1.7"
source = { registry = "https://pypi.org" }

[[package]]
name = "itsdangerous"
version = "2.2.0"
source = { registry = "https://pypi.org" }

[[package]]
name = "jinja2"
version = "3.1.4"
source = { registry = "https://pypi.org" }
dependencies = [
    { name = "markupsafe" },
]

[[package]]
name = "markupsafe"
version = "2.1.5"
source = { registry = "https://pypi.org" }

[[package]]
name = "werkzeug"
version = "3.0.3"
source = { registry = "https://pypi.org" }
dependencies = [
    { name = "markupsafe" },
]
